<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#22784d">
<title>OKEO Gestão V7</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon-v7.png">
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div id="loginScreen" class="login-screen">
  <form id="loginForm" class="login-card">
    <div class="brand"><img src="./okeo-logo.png" alt="OKEO"><div><h1>OKEO Gestão</h1><small>V7.1.0 Full Compatibility</small></div></div>
    <p>Acesso ao sistema</p>
    <label>Usuário</label><input id="loginUser" autocomplete="username" required>
    <label>Senha</label><input id="loginPass" type="password" autocomplete="current-password" required>
    <button id="loginBtn" class="primary" type="submit">Entrar</button>
    <div id="loginMsg" class="status"></div>
    <div class="login-health"><span id="jsHealth">JavaScript ativo</span><span id="apiHealth">Base: verificando…</span></div>
  </form>
</div>

<div id="app" class="app hidden">
  <header class="topbar">
    <button id="menuToggle" class="icon-btn mobile-only" aria-label="Menu">☰</button>
    <div class="brand mini"><img src="./okeo-logo.png" alt=""><b>OKEO Gestão</b><small>V7</small></div>
    <div class="top-status"><span id="onlineBadge">Online</span><span id="moduleStatus"></span></div>
    <div class="userbox"><span id="userName"></span><button id="logoutBtn" class="ghost">Sair</button></div>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <nav id="nav"></nav>
    </aside>
    <main id="main">
      <div id="legacyContainer" class="legacy-container hidden"><iframe id="legacyFrame" title="OKEO Gestão módulos completos"></iframe></div>
      <section id="moduleRoot" class="module-root">
        <div class="welcome">
          <h2>OKEO Gestão V7</h2>
          <p>Selecione um módulo. A navegação é independente do carregamento dos dados.</p>
        </div>
      </section>
    </main>
  </div>
</div>

<script type="module" src="./app-v7.js"></script>
</body>
</html>
